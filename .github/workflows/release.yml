name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin packages
        run: |
          ./package.sh
          ./package-full.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/threi-kz-full.zip \
            release/threi-kz-full.tar.gz \
            release/threi-kz-upgrade.zip \
            release/threi-kz-upgrade.tar.gz \
            release/threi-gokz-plugins.tar.gz \
            --title "ThRei KZ ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md
