// ThRei KZ Uploader
// Place this file in csgo/cfg/sourcemod/threi-kz-uploader.cfg

sm_threi_enable "1"
sm_threi_api_url "https://api.threi.cn"
sm_threi_api_key "threi_xxx"

// Runs per request. Keep <= 200.
sm_threi_batch_size "50"

// Seconds between checks.
sm_threi_interval "15.0"

// First TimeID to upload if no cursor file exists.
// 0 = backfill all history on first run.
sm_threi_backfill_from "0"

sm_threi_debug "0"
